resources:
  pipelines:
    medallion_dlt_pipeline:
      name: medallion_pipeline_${var.env}_${var.source_system}
      channel: ${var.pipeline_channel}
      continuous: false
      development: ${var.env == "dev" || var.env == "test"}
      photon: true
      edition: ADVANCED

      catalog: ${var.catalog_name}
      target: ${var.schema_prefix}_gold   # DLT publishes final tables here

      configuration:
        env: ${var.env}
        catalog_name: ${var.catalog_name}
        schema_prefix: ${var.schema_prefix}
        source_system: ${var.source_system}
        bronze_schema: ${var.schema_prefix}_bronze
        silver_schema: ${var.schema_prefix}_silver
        gold_schema: ${var.schema_prefix}_gold
        volume_name: ${var.volume_name}
        log_level: ${var.log_level}
        spark.databricks.delta.schema.autoMerge.enabled: "true"

      libraries:
        - notebook:
            path: /Shared/medallion_pipeline/${var.env}/src/dlt/bronze_layer
        - notebook:
            path: /Shared/medallion_pipeline/${var.env}/src/dlt/silver_layer
        - notebook:
            path: /Shared/medallion_pipeline/${var.env}/src/dlt/gold_layer

      clusters:
        - label: default
          autoscale:
            min_workers: ${var.min_workers}
            max_workers: ${var.max_workers}
          node_type_id: ${var.cluster_node_type}
          driver_node_type_id: ${var.cluster_node_type}
          spark_conf:
            spark.databricks.io.cache.enabled: "true"
          custom_tags:
            env: ${var.env}
            project: medallion_pipeline
            layer: dlt

      notifications:
        - recipients:
            - ${var.notification_email}
          alerts:
            - on-update-failure
            - on-update-fatal-failure
            - on-flow-failure
