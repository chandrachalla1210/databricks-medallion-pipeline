# ruff.toml
line-length = 100
target-version = "py311"

[lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "C4",  # flake8-comprehensions
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in defaults
    "SIM108", # ternary operator
    "N803",   # argument name should be lowercase (conflicts with Spark conventions)
    "N806",   # variable in function should be lowercase
]
exclude = ["dist/", ".venv/", "*.egg-info/"]

[format]
quote-style = "double"
indent-style = "space"
