[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers
markers =
    unit: Fast unit tests (no cluster)
    integration: Integration tests (require Databricks)
    slow: Slow tests

# Coverage
addopts =
    --tb=short
    -v
    --strict-markers

# Log format
log_cli = true
log_cli_level = INFO
log_format = %(asctime)s %(levelname)s %(message)s
log_date_format = %Y-%m-%d %H:%M:%S
